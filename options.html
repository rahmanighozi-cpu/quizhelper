<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pengaturan Quiz AI Helper</title>
  <style>
    body { font-family: sans-serif; padding: 20px; width: 320px; background: #ffffff; color: #000000; }
    input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #000; }
    button { width: 100%; padding: 10px; background: #000000; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #333333; }
    .status { margin-top: 10px; color: #16a34a; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Set API Key Gemini</h3>
  <label for="apiKey">API Key (Google AI Studio):</label>
  <input type="password" id="apiKey" placeholder="Masukkan Gemini API Key...">
  <button id="saveBtn">Simpan API Key</button>
  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
