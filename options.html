<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pengaturan Quiz AI Helper</title>
  <style>
    body { font-family: sans-serif; padding: 20px; width: 320px; background: #1e1e2e; color: #fff; }
    input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #444; background: #2b2b3b; color: #fff; }
    button { width: 100%; padding: 10px; background: #22c55e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #16a34a; }
    .status { margin-top: 10px; color: #4ade80; font-size: 12px; }
  </style>
</head>
<body>
  <h3>Set API Key Gemini</h3>
  <label for="apiKey">API Key (Google AI Studio):</label>
  <input type="password" id="apiKey" placeholder="Masukkan Gemini API Key...">
  <button id="saveBtn">Simpan API Key</button>
  <div id="status" class="status"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      chrome.storage.local.get(['geminiApiKey'], (result) => {
        if (result.geminiApiKey) {
          document.getElementById('apiKey').value = result.geminiApiKey;
        }
      });
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      chrome.storage.local.set({ geminiApiKey: apiKey }, () => {
        const status = document.getElementById('status');
        status.textContent = 'API Key berhasil disimpan!';
        setTimeout(() => status.textContent = '', 2000);
      });
    });
  </script>
</body>
</html>
